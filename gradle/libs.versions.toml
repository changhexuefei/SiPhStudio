[versions]
# Kotlin / Compose
kotlin = "2.4.0"
composeMultiplatform = "1.12.0-alpha01"

# AndroidX / JetBrains AndroidX
androidx-lifecycle = "2.11.0-beta01"
androidx-savedstate = "1.4.0"
androidx-window-core = "1.5.1"

# Compose Material / Navigation
compose-material3 = "1.12.0-alpha01"
compose-material3-adaptive = "1.3.0-beta01"
compose-navigation3-ui = "1.1.1"
compose-navigationevent = "1.1.0"

# KotlinX
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1-0.6.x-compat"

# Network
ktor = "3.0.0"

# Plot
lets-plot = "4.14.0"
lets-plot-compose = "3.2.0"

# Logging
slf4j = "2.0.17"

# Desktop JVM
javafx = "21.0.5"

# LWJGL
lwjgl = "3.4.1"
lwjgl3-awt = "0.2.4"


[libraries]
# =========================================================
# Lifecycle
# =========================================================
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# =========================================================
# Compose Navigation / Window / SavedState
# =========================================================
compose-navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "compose-navigation3-ui" }
compose-navigationevent = { group = "org.jetbrains.androidx.navigationevent", name = "navigationevent-compose", version.ref = "compose-navigationevent" }

androidx-savedstate = { group = "org.jetbrains.androidx.savedstate", name = "savedstate", version.ref = "androidx-savedstate" }
androidx-window-core = { group = "org.jetbrains.androidx.window", name = "window-core", version.ref = "androidx-window-core" }

# =========================================================
# Compose Material3 / Adaptive
# =========================================================
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }

compose-material3-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-layout = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-layout", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-nav3 = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "compose-material3-adaptive" }

compose-material3-adaptive-navigation = { group = "org.jetbrains.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "compose-material3" }

# =========================================================
# KotlinX
# =========================================================
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# =========================================================
# Ktor
# =========================================================
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }

# =========================================================
# Plot
# =========================================================
lets-plot-kotlin = { module = "org.jetbrains.lets-plot:lets-plot-kotlin", version.ref = "lets-plot" }
lets-plot-compose = { module = "org.jetbrains.lets-plot:lets-plot-compose", version.ref = "lets-plot-compose" }

# =========================================================
# Logging
# =========================================================
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# =========================================================
# JavaFX
#
# 注意：
# JavaFX 在 Desktop 里通常需要平台 classifier：
# win / mac / mac-aarch64 / linux
#
# 所以这里保留普通 alias，
# 真正使用时建议在 build.gradle.kts 里写：
# implementation("org.openjfx:javafx-controls:$javafxVersion:$javafxPlatform")
# =========================================================
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }

# =========================================================
# LWJGL
#
# 注意：
# 1. org.lwjgl:* 使用 BOM 统一版本。
# 2. lwjgl / lwjgl-opengl / lwjgl-jawt 不单独写 version。
# 3. natives-windows / natives-macos / natives-linux 不要写在 TOML 里。
# 4. native jar 应该在 build.gradle.kts 里 runtimeOnly 动态添加。
# =========================================================
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl = { module = "org.lwjgl:lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-jawt = { module = "org.lwjgl:lwjgl-jawt" }
lwjgl3-awt = { module = "org.lwjglx:lwjgl3-awt", version.ref = "lwjgl3-awt" }


[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
