name: Compose App

on:
  push:
    branches:
      - master
      - safety/**
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - ".github/workflows/compose-app.yml"
  pull_request:
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - ".github/workflows/compose-app.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Compile and test Compose JVM
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Compose JVM
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\gradlew.bat :composeApp:compileKotlinJvm :composeApp:jvmTest --no-daemon --stacktrace --info --console=plain --max-workers=2 2>&1 | Tee-Object -FilePath compose-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Compose build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-build-log
          path: compose-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test and production acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports
          path: |
            composeApp/build/reports/tests
            composeApp/build/reports/production-acceptance
          if-no-files-found: ignore
          retention-days: 7
