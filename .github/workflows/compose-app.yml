name: Compose App

on:
  push:
    branches:
      - master
      - agent/**
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - ".github/workflows/compose-app.yml"
  pull_request:
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - ".github/workflows/compose-app.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Compile and test Compose JVM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and run offline tests
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinJvm :composeApp:jvmTest --stacktrace 2>&1 | tee compose-build.log

      - name: Upload Compose build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-build-log
          path: compose-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports
          path: composeApp/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
