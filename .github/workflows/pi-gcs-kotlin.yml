name: PI GCS Kotlin

on:
  pull_request:
    paths:
      - 'pi-gcs-kotlin/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/pi-gcs-kotlin.yml'
  push:
    branches: [master]
    paths:
      - 'pi-gcs-kotlin/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/pi-gcs-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-gcs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-gcs-test:
    name: PI GCS protocol and safety tests (Windows JDK21)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run PI GCS Kotlin tests
        shell: pwsh
        run: .\gradlew.bat :pi-gcs-kotlin:test --no-daemon --stacktrace
      - name: Negative-test recovery evidence verifier
        shell: pwsh
        run: |
          ./.github/scripts/test-pi-gcs-evidence-gate.ps1 `
            -Root 'pi-gcs-kotlin/build/ci/virtual-gcs-evidence/recovery-soak' `
            -RunId '${{ github.run_id }}' `
            -Revision '${{ github.sha }}'
      - name: Verify recovery evidence before artifact upload
        shell: pwsh
        run: |
          ./.github/scripts/verify-pi-gcs-evidence.ps1 `
            -Root 'pi-gcs-kotlin/build/ci/virtual-gcs-evidence/recovery-soak' `
            -RunId '${{ github.run_id }}' `
            -Revision '${{ github.sha }}' `
            -CycleCount 20
      - name: Publish virtual-only acceptance summary
        shell: pwsh
        run: |
          ./.github/scripts/write-pi-gcs-acceptance-summary.ps1 `
            -Root 'pi-gcs-kotlin/build/ci/virtual-gcs-evidence/recovery-soak' `
            -RunId '${{ github.run_id }}' `
            -Revision '${{ github.sha }}'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-gcs-test-reports
          path: |
            pi-gcs-kotlin/build/reports/tests/
            pi-gcs-kotlin/build/test-results/
            pi-gcs-kotlin/build/ci/virtual-gcs-evidence/
          if-no-files-found: ignore
